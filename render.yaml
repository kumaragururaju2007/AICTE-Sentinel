services:
  # 1. FastAPI Backend Service (Python)
  - type: web
    name: aicte-sentinel-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: postgresql://postgres.dsycvemejarzneqxitui:Guru@2007200@aws-0-eu-west-2.pooler.supabase.com:5432/postgres
      - key: SECRET_KEY
        generateValue: true

  # 2. React Frontend (Static Site)
  - type: web
    name: aicte-sentinel-frontend
    runtime: static
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
